{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message | Careerly</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
    {% include 'partials/admin_nav.html' %}

    <main class="admin-page">
        <div class="container">
            <a href="/admin-dashboard" class="back-link">&larr; Back to dashboard</a>
            <h1 class="admin-title">{{ msg.subject }}</h1>
            <p class="admin-subtitle">{{ msg.created_at|date:"M d, Y - H:i" }}</p>

            <div class="admin-card mb-4">
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <span class="detail-label">From</span>
                        <p class="detail-value">{{ msg.name }}</p>
                    </div>
                    <div class="col-md-6">
                        <span class="detail-label">Email</span>
                        <p class="detail-value">{{ msg.email }}</p>
                    </div>
                </div>
                <span class="detail-label">Message</span>
                <p class="message-body">{{ msg.message|linebreaksbr }}</p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
